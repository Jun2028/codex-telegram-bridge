<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Machine Files</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/highlight.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <section id="browser" aria-label="Files">
      <header class="bar">
        <div class="where">
          <p id="machine" class="machine">Connecting…</p>
          <nav id="breadcrumbs" aria-label="Folder path"></nav>
        </div>
        <button id="refresh" class="icon-button" title="Refresh" aria-label="Refresh folder"></button>
      </header>
      <label class="search">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="filter" type="search" placeholder="Filter this folder" aria-label="Filter this folder" autocomplete="off">
      </label>
      <div id="file-list" role="list" aria-label="Files"></div>
      <p id="file-count" class="count"></p>
    </section>

    <section id="viewer" aria-label="File">
      <div id="empty" class="placeholder"><p>Select a file to view it.</p></div>
      <div id="file-view" hidden>
        <header class="bar file-bar">
          <button id="back" class="icon-button" aria-label="Back to files"></button>
          <div class="file-title">
            <h2 id="file-name"></h2>
            <p id="file-path"></p>
          </div>
          <button id="edit" class="button" hidden>Edit</button>
          <button id="save" class="button primary" hidden disabled>Save</button>
          <button id="download" class="icon-button" title="Download" aria-label="Download"></button>
        </header>
        <div id="notice" role="status" hidden></div>
        <div id="code-view" class="code" tabindex="0">
          <pre id="line-numbers" aria-hidden="true"></pre>
          <pre id="code"></pre>
        </div>
        <textarea id="editor" aria-label="File contents" spellcheck="false" wrap="off" hidden></textarea>
        <div id="image-view" class="image-view" hidden><img id="preview-image" alt=""></div>
        <div id="binary-view" class="placeholder" hidden><p>No preview for this file type.<br>Download it to open it.</p></div>
        <footer class="status">
          <span id="save-state"></span>
          <span id="file-details"></span>
          <button id="reload" class="link">Reload</button>
        </footer>
      </div>
    </section>
  </main>
  <div id="toast" role="status" hidden></div>
</body>
</html>
